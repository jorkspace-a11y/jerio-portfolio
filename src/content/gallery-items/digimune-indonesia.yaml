order: 8
title: Digimune Indonesia
industry: Consumer Products
size: wide
status: ongoing
description: >-
  One engagement, not four separate clients. Under Digimune Indonesia sits the Luna Project, three brands, three calendars, kept genuinely distinct. Cafero runs editorial, jetsetter luxury photography ("caffeine that skips the café"). XBooster leans into neon, high energy studio product shots. 77 Pouches stays clean: premium fruit and mint styling. IndoTek and Andiamo are further projects under the same engagement, case studies pending. All three Luna brands launch in Bali, June or July 2026. Ongoing.
